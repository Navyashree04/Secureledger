spring:
  application:
    name: secureledger
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

jwt:
  secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret-32bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1h

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/secureledger
    username: ${DB_USERNAME:secureledger}
    password: ${DB_PASSWORD:secureledger}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:secureledger;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/secureledger
    username: ${DB_USERNAME:secureledger}
    password: ${DB_PASSWORD:secureledger}
  jpa:
    hibernate:
      ddl-auto: update
